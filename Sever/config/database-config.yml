# Laya Game Database Unified Configuration File
# Database connection configuration for all microservices

# Database connection information
database:
  # Basic configuration
  host: localhost
  port: 3306
  name: laya_game
  username: laya_user
  password: laya123456

  # Connection parameters
  url: jdbc:mysql://${database.host}:${database.port}/${database.name}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
  driver-class-name: com.mysql.cj.jdbc.Driver

  # Connection pool configuration
  hikari:
    maximum-pool-size: 20
    minimum-idle: 5
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000
    leak-detection-threshold: 60000

  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: validate  # Use validate for production, update for development
    show-sql: false  # Turn off SQL logs in production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true

# Redis configuration
redis:
  host: localhost
  port: 6379
  password:
  database: 0
  timeout: 3000ms
  lettuce:
    pool:
      max-active: 20
      max-idle: 10
      min-idle: 5
      max-wait: 3000ms

# Environment configuration
environments:
  # Development environment
  dev:
    database:
      host: localhost
      port: 3306
      name: laya_game
      username: laya_user
      password: laya123456
    jpa:
      show-sql: true
      hibernate:
        ddl-auto: update

  # Test environment
  test:
    database:
      host: localhost
      port: 3306
      name: laya_game_test
      username: laya_user
      password: laya123456
    jpa:
      show-sql: true
      hibernate:
        ddl-auto: create-drop

  # Production environment
  prod:
    database:
      host: ${DB_HOST:localhost}
      port: ${DB_PORT:3306}
      name: ${DB_NAME:laya_game}
      username: ${DB_USERNAME:laya_user}
      password: ${DB_PASSWORD:laya123456}
    jpa:
      show-sql: false
      hibernate:
        ddl-auto: validate
