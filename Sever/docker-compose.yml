version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: laya-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: laya_game
      MYSQL_USER: laya_user
      MYSQL_PASSWORD: laya123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - laya-network
    restart: unless-stopped

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: laya-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./database/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - laya-network
    restart: unless-stopped

  # 数据库服务器
  database-server:
    build: .
    container_name: laya-database-server
    command: database
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    networks:
      - laya-network
    restart: unless-stopped

  # 登录服务器
  login-server:
    build: .
    container_name: laya-login-server
    command: login
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    networks:
      - laya-network
    restart: unless-stopped

  # 游戏服务器
  game-server:
    build: .
    container_name: laya-game-server
    command: game
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    networks:
      - laya-network
    restart: unless-stopped

  # 网关服务器
  gateway-server:
    build: .
    container_name: laya-gateway-server
    command: gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LOGIN_SERVER_HOST: login-server
      LOGIN_SERVER_PORT: 8081
      GAME_SERVER_HOST: game-server
      GAME_SERVER_PORT: 8082
      DATABASE_SERVER_HOST: database-server
      DATABASE_SERVER_PORT: 8083
    depends_on:
      - login-server
      - game-server
      - database-server
    networks:
      - laya-network
    restart: unless-stopped

  # Nginx反向代理 (可选)
  nginx:
    image: nginx:alpine
    container_name: laya-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - gateway-server
      - login-server
      - game-server
      - database-server
    networks:
      - laya-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  laya-network:
    driver: bridge
