# Laya Game 消息 ID 唯一来源
#
# scope:
#   gateway - Gateway 本地处理或产生，不转发到 Game Server
#   game    - 由 Game Server 处理或产生
#   shared  - Gateway 与 Game Server 都可能使用的系统协议
#
# 新增普通游戏协议只使用 game，不需要修改或重新发布 Gateway。

version: 1.1.0

# ========== Start 包消息 (101-199) ==========
LOGIN: { id: 101, scope: game }
LOGIN_SUCCESS: { id: 102, scope: game }
LOGIN_FAILED: { id: 103, scope: game }
GAME_INIT_REQUEST: { id: 105, scope: game }
GAME_INIT_RESPONSE: { id: 106, scope: game }

# ========== Gateway 认证 ==========
AUTH: { id: 1001, scope: gateway }
AUTH_SUCCESS: { id: 1002, scope: gateway }
AUTH_FAILED: { id: 1003, scope: gateway }

# ========== Gateway 心跳 ==========
HEARTBEAT: { id: 2001, scope: gateway }
HEARTBEAT_RESPONSE: { id: 2002, scope: gateway }

# ========== 游戏逻辑 ==========
GET_PLAYER_INFO: { id: 3010, scope: game }
PLAYER_INFO: { id: 3011, scope: game }
PLAYER_LEVEL_UP_REQUEST: { id: 3012, scope: game }
PLAYER_LEVEL_UP_RESPONSE: { id: 3013, scope: game }
BATTLE_ENTER_REQUEST: { id: 3014, scope: game }
BATTLE_ENTER_RESPONSE: { id: 3015, scope: game }
BATTLE_COMPLETE_REQUEST: { id: 3016, scope: game }
BATTLE_COMPLETE_RESPONSE: { id: 3017, scope: game }

FUNCTION_OPEN_STATES: { id: 4001, scope: game }
FUNCTION_OPEN_PUSH: { id: 4002, scope: game }

GUIDE_PROGRESS_REQUEST: { id: 4101, scope: game }
GUIDE_PROGRESS_RESPONSE: { id: 4102, scope: game }

# ========== Bag ==========
BAG_SNAPSHOT_REQUEST: { id: 5001, scope: game }
BAG_SNAPSHOT_RESPONSE: { id: 5002, scope: game }

# ========== 系统协议 ==========
ERROR: { id: 9001, scope: shared }
NOTIFICATION: { id: 9002, scope: gateway }
KICK: { id: 9004, scope: shared }
